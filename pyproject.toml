[project]
name = "print-models"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "manifold3d>=3.5.4",
    "numpy>=2.5.4",
    "python-fcl>=0.7.0.11",
    "scipy>=1.18.1",
    "trimesh>=5.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
norecursedirs = [".*", "build", "vendor", "*.venv", "hello-cq", "my-cq", "solidpy"]
