name: design checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BLENDER_VERSION: 5.0.1

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD and Blender's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 libgl1 libegl1
          openscad --version

      # The .blend files are saved by Blender 5.0, newer than Ubuntu's package, so use
      # the official build (cached: ~370 MB).
      # restore/save rather than actions/cache, whose save is skipped when the job fails
      # (and the job fails whenever a design has a known failing check).
      - name: Restore Blender
        id: blender-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -sSfL "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            | tar -xJ -C ~/blender --strip-components=1

      - name: Save Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Use Blender
        run: |
          echo "BLENDER=$HOME/blender/blender" >> "$GITHUB_ENV"
          ~/blender/blender --version | head -1

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Keep going when tests fail so the published report shows the failures;
      # the last step fails the job afterwards.
      - name: Run design tests
        id: tests
        continue-on-error: true
        run: uv run pytest -v

      - name: Build site
        run: uv run python -m scadcheck.site _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Fail if tests failed
        if: steps.tests.outcome != 'success'
        run: exit 1

  deploy:
    # Publish only from main, even when tests fail, so the site shows the current state.
    if: github.ref == 'refs/heads/main' && !cancelled() && needs.test.result != 'skipped'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
